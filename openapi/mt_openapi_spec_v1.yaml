  "/api/bulk_requests":
    get:
      summary: list bulk_requests
      tags:
      - BulkRequest
      operationId: listBulkRequests
      security:
      - basic_auth: []
      parameters:
      - name: action_type
        in: query
        schema:
          enum:
          - create
          - update
          - delete
          type: string
        required: false
        description: One of create, or update.
      - name: after_cursor
        in: query
        schema:
          nullable: true
          type: string
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: resource_type
        in: query
        schema:
          enum:
          - payment_order
          - ledger_account
          - ledger_transaction
          - expected_payment
          - transaction
          - transaction_line_item
          type: string
        required: false
        description: One of payment_order, expected_payment, or ledger_transaction.
      - name: status
        in: query
        schema:
          enum:
          - pending
          - processing
          - completed
          type: string
        required: false
        description: One of pending, processing, or completed.
      - "$ref": "#/components/parameters/metadata_query"
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
                type: string
              required: false
              description: The cursor for the next page. Including this in a call
                as `after_cursor` will return the next page.
            X-Per-Page:
              schema:
                nullable: true
                type: integer
              description: The current `per_page`.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/bulk_request"
        '401':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
        '403':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
    post:
      summary: create bulk_request
      tags:
      - BulkRequest
      operationId: createBulkRequest
      security:
      - basic_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        required: false
        description: This key should be something unique, preferably something like
          an UUID.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/bulk_request_create_request"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/bulk_request"
        '401':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
        '403':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
        '422':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
  "/api/bulk_requests/{id}":
    parameters:
