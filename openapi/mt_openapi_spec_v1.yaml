  "/api/payment_orders":
    get:
      summary: list payment orders
      tags:
      - PaymentOrder
      operationId: listPaymentOrders
      description: Get a list of all payment orders
      security:
      - basic_auth: []
      parameters:
      - name: after_cursor
        in: query
        schema:
          nullable: true
          type: string
        required: false
      - name: counterparty_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: created_at_end
        in: query
        schema:
          format: date
          type: string
        required: false
        description: An inclusive upper bound for searching created_at
      - name: created_at_start
        in: query
        schema:
          format: date
          type: string
        required: false
        description: An inclusive lower bound for searching created_at
      - name: direction
        in: query
        schema:
          enum:
          - credit
          - debit
          type: string
        required: false
      - name: effective_date_end
        in: query
        schema:
          format: date
          type: string
        required: false
        description: An inclusive upper bound for searching effective_date
      - name: effective_date_start
        in: query
        schema:
          format: date
          type: string
        required: false
        description: An inclusive lower bound for searching effective_date
      - name: external_id
        in: query
        schema:
          type: string
        required: false
      - name: originating_account_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: priority
        in: query
        schema:
          enum:
          - high
          - normal
          type: string
        required: false
        description: Either `normal` or `high`. For ACH and EFT payments, `high` represents
          a same-day ACH or EFT transfer, respectively. For check payments, `high`
          can mean an overnight check rather than standard mail.
      - name: process_after_end
        in: query
        schema:
          format: date-time
          type: string
        required: false
        description: An inclusive upper bound for searching process_after
      - name: process_after_start
        in: query
        schema:
          format: date-time
          type: string
        required: false
        description: An inclusive lower bound for searching process_after
      - name: reference_number
        in: query
        schema:
          type: string
        required: false
        description: Query for records with the provided reference number
      - name: status
        in: query
        schema:
          enum:
          - approved
          - cancelled
          - completed
          - denied
          - failed
          - held
          - needs_approval
          - pending
          - processing
          - returned
          - reversed
          - sent
          - stopped
          type: string
        required: false
      - name: transaction_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: The ID of a transaction that the payment order has been reconciled
          to.
      - name: type
        in: query
        schema:
          enum:
          - ach
          - au_becs
          - bacs
          - book
          - card
          - chats
          - check
          - cross_border
          - dk_nets
          - eft
          - gb_fps
          - masav
          - mx_ccen
          - neft
          - nics
          - nz_becs
          - pl_elixir
          - rtp
          - se_bankgirot
          - sepa
          - sg_giro
          - sic
          - stablecoin
          - wire
          - zengin
          type: string
        required: false
      - "$ref": "#/components/parameters/metadata_query"
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
                type: string
              required: false
              description: The cursor for the next page. Including this in a call
                as `after_cursor` will return the next page.
            X-Per-Page:
              schema:
                nullable: true
                type: integer
              description: The current `per_page`.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/payment_order"
    post:
      summary: create payment order
      tags:
      - PaymentOrder
      operationId: createPaymentOrder
      description: Create a new Payment Order
      security:
      - basic_auth: []
      parameters:
      - name: Content-Type
        in: header
        schema:
          enum:
          - application/json
          - multipart/form-data
          type: string
        required: false
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        required: false
        description: This key should be something unique, preferably something like
          an UUID.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/payment_order_create_request"
          multipart/form-data:
            schema:
              "$ref": "#/components/schemas/payment_order_create_request"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/payment_order"
        '400':
          description: parameter_invalid
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
        '401':
