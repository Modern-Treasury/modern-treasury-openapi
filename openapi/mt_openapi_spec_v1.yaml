  "/api/bulk_results":
    get:
      summary: list bulk_results
      tags:
      - BulkResult
      operationId: listBulkResults
      security:
      - basic_auth: []
      parameters:
      - name: after_cursor
        in: query
        schema:
          nullable: true
          type: string
        required: false
      - name: entity_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: Unique identifier for the result entity object.
      - name: entity_type
        in: query
        schema:
          enum:
          - payment_order
          - ledger_account
          - ledger_transaction
          - expected_payment
          - transaction
          - transaction_line_item
          - bulk_error
          type: string
        required: false
        description: The type of the request that created this result. bulk_request
          is the only supported `request_type`
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: request_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: Unique identifier for the request that created this bulk result.
          This is the ID of the bulk request when `request_type` is bulk_request
      - name: request_type
        in: query
        schema:
          enum:
          - bulk_request
          type: string
        required: false
        description: The type of the request that created this result. bulk_request
          is the only supported `request_type`
      - name: status
        in: query
        schema:
          enum:
          - pending
          - successful
          - failed
          type: string
        required: false
        description: One of successful or failed.
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
                type: string
              required: false
              description: The cursor for the next page. Including this in a call
                as `after_cursor` will return the next page.
            X-Per-Page:
              schema:
                nullable: true
                type: integer
              description: The current `per_page`.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/bulk_result"
        '401':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
        '403':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
  "/api/bulk_results/{id}":
    parameters:
