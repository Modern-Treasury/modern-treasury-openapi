        in: query
        schema:
          enum:
          - completed
          - pending
          - returned
          type: string
        required: false
        description: The current status of the incoming payment order. One of `pending`,
          `completed`, or `returned`.
      - name: subtype
        in: query
        schema:
          type: string
        required: false
