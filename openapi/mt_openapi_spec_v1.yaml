    url: https://moderntreasury.com
  description: The Modern Treasury REST API. Please see https://docs.moderntreasury.com
    for more details.
paths:
  "/api/account_collection_flows":
    get:
      summary: list account_collection_flows
      tags:
      - AccountCollectionFlow
      operationId: listAccountCollectionFlows
      security:
      - basic_auth: []
      parameters:
      - name: after_cursor
        in: query
        schema:
          nullable: true
          type: string
        required: false
      - name: client_token
        in: query
        schema:
          type: string
        required: false
      - name: counterparty_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: external_account_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: status
        in: query
        schema:
          type: string
        required: false
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
                type: string
              required: false
              description: The cursor for the next page. Including this in a call
                as `after_cursor` will return the next page.
            X-Per-Page:
              schema:
                nullable: true
                type: integer
              description: The current `per_page`.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/account_collection_flow"
    post:
      summary: create account_collection_flow
      tags:
      - AccountCollectionFlow
      operationId: createAccountCollectionFlow
      security:
      - basic_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        required: false
        description: This key should be something unique, preferably something like
          an UUID.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/account_collection_flow_create_request"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/account_collection_flow"
        '422':
          description: unsuccessful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
