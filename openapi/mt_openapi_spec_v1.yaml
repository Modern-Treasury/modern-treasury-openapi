servers:
- url: http://localhost:3000
- url: https://app.moderntreasury.com
components:
  parameters:
    bulk_id:
      name: id[]
      in: query
      schema:
        items:
          type: string
        type: array
      style: form
      explode: true
      allowReserved: true
      required: false
      description: If you have specific IDs to retrieve in bulk, you can pass them
        as query parameters delimited with `id[]=`, for example `?id[]=123&id[]=abc`.
    bulk_name:
      name: name[]
      in: query
      schema:
        items:
          type: string
        type: array
      style: form
      explode: true
      allowReserved: true
      required: false
      description: If you have specific names to retrieve in bulk, you can pass them
        as query parameters delimited with `name[]=`, for example `?name[]=123&name[]=abc`.
    metadata_query:
      name: metadata
      in: query
      schema:
        additionalProperties:
          type: string
        type: object
      style: deepObject
      explode: true
      required: false
      description: For example, if you want to query for records with metadata key
        `Type` and value `Loan`, the query would be `metadata%5BType%5D=Loan`. This
        encodes the query parameters.
  schemas:
    account_capability:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        direction:
          type: string
          enum:
          - credit
          - debit
          description: One of `debit` or `credit`. Indicates the direction of money
            movement this capability is responsible for.
        discarded_at:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
          format: uuid
        identifier:
          type: string
          nullable: true
          description: A unique reference assigned by your bank for tracking and recognizing
            payment files. It is important this is formatted exactly how the bank
            assigned it.
        live_mode:
          type: boolean
          description: This field will be true if this object exists in the live environment
            or false if it exists in the test environment.
        object:
          type: string
        payment_type:
          type: string
          enum:
          - ach
          - au_becs
          - bacs
          - book
          - card
          - chats
          - check
          - cross_border
          - dk_nets
          - eft
          - gb_fps
          - masav
          - mx_ccen
          - neft
          - nics
          - nz_becs
          - pl_elixir
          - rtp
          - se_bankgirot
          - sepa
          - sg_giro
          - sic
          - stablecoin
          - wire
          - zengin
          description: Indicates the the type of payment this capability is responsible
            for originating.
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
      required:
      - id
      - object
      - live_mode
      - created_at
      - updated_at
      - discarded_at
      - direction
      - identifier
      - payment_type
      minProperties: 9
      maxProperties: 9
    account_capability_update_request:
      type: object
      properties:
        identifier:
          type: string
          description: A unique reference assigned by your bank for tracking and recognizing
            payment files. It is important this is formatted exactly how the bank
            assigned it.
      additionalProperties: false
      required:
      - identifier
      minProperties: 1
      maxProperties: 1
    account_collection_flow:
      type: object
      properties:
        client_token:
          type: string
          description: The client token of the account collection flow.  This token
            can be used to embed account collection in your client-side application.
        counterparty_id:
          type: string
          format: uuid
          description: The ID of a counterparty. An external account created with
            this flow will be associated with this counterparty.
        created_at:
          type: string
          format: date-time
        external_account_id:
          type: string
          format: uuid
          nullable: true
          description: If present, the ID of the external account created using this
            flow.
        id:
          type: string
          format: uuid
        live_mode:
          type: boolean
          description: This field will be true if this object exists in the live environment
            or false if it exists in the test environment.
        object:
          type: string
        payment_types:
          type: array
          items:
            type: string
            enum:
            - ach
            - wire
            description: An account created with this flow will support payments of
              one of these types.
        receiving_countries:
          type: array
          items:
            type: string
            enum:
            - USA
            - AUS
            - BEL
            - CAN
            - CHL
            - CHN
            - COL
            - FRA
            - DEU
            - HKG
            - IND
            - IRL
            - ITA
            - MEX
            - NLD
            - PER
            - ESP
            - GBR
            description: An account created with this flow will support wires from
              the US to these countries.
        status:
          type: string
          enum:
          - cancelled
          - completed
          - expired
          - pending
          description: The current status of the account collection flow. One of `pending`,
            `completed`, `expired`, or `cancelled`.
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
      required:
      - payment_types
      - counterparty_id
      minProperties: 10
    account_collection_flow_create_request:
      type: object
      properties:
        counterparty_id:
          type: string
          format: uuid
          description: Required.
        payment_types:
          type: array
          items:
            type: string
            description: Required. At least one of `ach`, `wire` or `check`.
        receiving_countries:
          type: array
