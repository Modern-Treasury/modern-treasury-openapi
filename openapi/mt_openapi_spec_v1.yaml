          - au_becs
          - bacs
          - book
          - check
          - eft
          - neft
          - nz_becs
          - rtp
          - sepa
          - stablecoin
          - wire
          - zengin
          type: string
        required: false
        description: 'One of: `ach`, `book`, `check`, `eft`, `rtp`, `sepa`, or `wire`.'
