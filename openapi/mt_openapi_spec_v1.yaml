    incoming_payment_detail:
      type: object
      properties:
        amount:
          type: integer
          description: Value in specified currency's smallest unit. e.g. $10 would
            be represented as 1000.
        as_of_date:
          type: string
          format: date
          description: The date on which the corresponding transaction will occur.
        created_at:
          type: string
          format: date-time
        currency:
          "$ref": "#/components/schemas/currency"
          description: The currency of the incoming payment detail.
        data:
          type: object
          description: The raw data from the payment pre-notification file that we
            get from the bank.
        direction:
          type: string
          enum:
          - credit
          - debit
          description: One of `credit` or `debit`.
        id:
          type: string
          format: uuid
        internal_account_id:
          type: string
          format: uuid
          description: The ID of the Internal Account for the incoming payment detail.
            This is always present.
        ledger_transaction_id:
          type: string
          format: uuid
          nullable: true
          description: The ID of the ledger transaction linked to the incoming payment
            detail or `null`.
        live_mode:
          type: boolean
          description: This field will be true if this object exists in the live environment
            or false if it exists in the test environment.
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Additional data represented as key-value pairs. Both the key
            and value must be strings.
          example:
            foo: bar
            key: value
            modern: treasury
        object:
          type: string
        originating_account_number:
          type: string
          nullable: true
          description: The account number of the originating account for the incoming
            payment detail.
        originating_account_number_safe:
          type: string
          nullable: true
          description: The last 4 digits of the originating account_number for the
            incoming payment detail.
        originating_account_number_type:
          type: string
          nullable: true
          enum:
          - arbitrum_address
          - au_number
          - base_address
          - card_token
          - clabe
          - ethereum_address
          - hk_number
          - iban
          - id_number
          - nz_number
          - other
          - pan
          - polygon_address
          - sg_number
          - solana_address
          description: The type of the originating account number for the incoming
            payment detail.
        originating_party_address:
          "$ref": "#/components/schemas/address"
          nullable: true
          description: The address of the originating party for the incoming payment
            detail, or `null`.
        originating_party_name:
          type: string
          nullable: true
          description: The name of the originating party for the incoming payment
            detail.
        originating_party_vendor_identifier:
          type: string
          nullable: true
          description: The vendor-assigned identifier for the originating party of
            the incoming payment detail, or `null`.
        originating_routing_number:
          type: string
          nullable: true
          description: The routing number of the originating account for the incoming
            payment detail.
        originating_routing_number_type:
          type: string
          nullable: true
          enum:
          - aba
          - au_bsb
          - br_codigo
          - ca_cpa
          - chips
          - cnaps
          - dk_interbank_clearing_code
          - gb_sort_code
          - hk_interbank_clearing_code
          - il_bank_code
          - in_ifsc
          - jp_zengin_code
          - mx_bank_identifier
          - my_branch_code
          - nz_national_clearing_code
          - pl_national_clearing_code
          - se_bankgiro_clearing_code
          - sg_interbank_clearing_code
          - swift
          - za_national_clearing_code
          description: The type of the originating routing number for the incoming
            payment detail.
        receiving_account_number:
          type: string
          nullable: true
          description: The account number of the receiving account for the incoming
            payment detail, or `null`.
        receiving_account_number_safe:
          type: string
          nullable: true
          description: The last 4 digits of the receiving account number for the incoming
            payment detail, or `null`.
        reconciliation_status:
          type: string
          enum:
          - unreconciled
          - tentatively_reconciled
          - reconciled
          description: One of `unreconciled`, `tentatively_reconciled` or `reconciled`.
        status:
          type: string
          enum:
          - completed
          - pending
          - returned
          description: The current status of the incoming payment order. One of `pending`,
            `completed`, or `returned`.
        subtype:
          type: string
          nullable: true
          description: An additional layer of classification for the type of incoming
            payment detail. For example, a `type` of `stablecoin` may have a `subtype`
            of `ethereum` or `solana`.
        transaction_id:
          type: string
          format: uuid
          nullable: true
          description: The ID of the reconciled Transaction or `null`.
        transaction_line_item_id:
          type: string
          format: uuid
          nullable: true
          description: The ID of the reconciled Transaction Line Item or `null`.
        type:
