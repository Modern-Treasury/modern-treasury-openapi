          type: string
        required: false
      - name: ledgerable_type
        in: query
        schema:
          enum:
          - expected_payment
          - incoming_payment_detail
          - payment_order
          - return
          - reversal
          type: string
        required: false
      - name: order_by
        in: query
        schema:
          additionalProperties: false
          properties:
            created_at:
              enum:
              - asc
              - desc
              type: string
            effective_at:
              enum:
              - asc
              - desc
              type: string
          type: object
        style: deepObject
        required: false
        description: Order by `created_at` or `effective_at` in `asc` or `desc` order.
          For example, to order by `effective_at asc`, use `order_by%5Beffective_at%5D=asc`.
          Ordering by only one field at a time is supported.
      - name: partially_posts_ledger_transaction_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: posted_at
        in: query
        schema:
          additionalProperties:
            format: date-time
            type: string
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by the posted at timestamp. For example, for all times after Jan
          1 2000 12:00 UTC, use posted_at%5Bgt%5D=2000-01-01T12:00:00Z.
      - name: reverses_ledger_transaction_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: status
        in: query
        schema:
          oneOf:
          - enum:
            - pending
            - posted
            - archived
            type: string
          - items:
              enum:
              - pending
              - posted
              - archived
              type: string
            type: array
        required: false
      - name: updated_at
        in: query
        schema:
          additionalProperties:
            format: date-time
            type: string
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by the posted at timestamp. For example, for all times after Jan
          1 2000 12:00 UTC, use updated_at%5Bgt%5D=2000-01-01T12:00:00Z.
      - "$ref": "#/components/parameters/bulk_id"
      - "$ref": "#/components/parameters/metadata_query"
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
                type: string
              required: false
              description: The cursor for the next page. Including this in a call
                as `after_cursor` will return the next page.
            X-Per-Page:
              schema:
