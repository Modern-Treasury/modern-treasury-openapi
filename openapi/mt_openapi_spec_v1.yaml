  "/api/ledger_entries":
    get:
      summary: list ledger_entries
      tags:
      - LedgerEntry
      operationId: listLedgerEntries
      description: Get a list of all ledger entries.
      security:
      - basic_auth: []
      parameters:
      - name: after_cursor
        in: query
        schema:
          nullable: true
          type: string
        required: false
      - name: amount
        in: query
        schema:
          properties:
            eq:
              type: integer
            gt:
              type: integer
            gte:
              type: integer
            lt:
              type: integer
            lte:
              type: integer
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by amount.
      - name: as_of_lock_version
        in: query
        schema:
          type: integer
        required: false
        description: Shows all ledger entries that were present on a ledger account
          at a particular `lock_version`. You must also specify `ledger_account_id`.
      - name: direction
        in: query
        schema:
          enum:
          - credit
          - debit
          type: string
        required: false
        description: If true, response will include ledger entries that were deleted.
          When you update a ledger transaction to specify a new set of entries, the
          previous entries are deleted.
      - name: effective_at
        in: query
        schema:
          additionalProperties:
            format: date-time
            type: string
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by the transaction's effective time. Format ISO8601
      - name: effective_date
        in: query
        schema:
          additionalProperties:
            format: date
            type: string
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by the transaction's effective date. Format YYYY-MM-DD
      - name: ledger_account_category_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: Get all ledger entries that match the direction specified. One
          of `credit`, `debit`.
      - name: ledger_account_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: ledger_account_lock_version
        in: query
        schema:
          additionalProperties:
            type: integer
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by the lock_version of a ledger account. For example, for all entries
          created at or before before lock_version 1000 of a ledger account, use `ledger_account_lock_version%5Blte%5D=1000`.
      - name: ledger_account_payout_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: ledger_account_settlement_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: ledger_account_statement_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: Get all ledger entries that are included in the ledger account
          statement.
      - name: ledger_transaction_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
      - name: order_by
        in: query
        schema:
          additionalProperties: false
          properties:
            created_at:
              enum:
              - asc
              - desc
              type: string
            effective_at:
              enum:
              - asc
              - desc
              type: string
          type: object
        style: deepObject
        required: false
        description: Order by `created_at` or `effective_at` in `asc` or `desc` order.
          For example, to order by `effective_at asc`, use `order_by%5Beffective_at%5D=asc`.
          Ordering by only one field at a time is supported.
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: show_balances
        in: query
        schema:
          type: boolean
        required: false
        description: If true, response will include the balances attached to the ledger
          entry. If there is no balance available, null will be returned instead.
      - name: show_deleted
        in: query
        schema:
          type: boolean
        required: false
        description: If true, response will include ledger entries that were deleted.
          When you update a ledger transaction to specify a new set of entries, the
          previous entries are deleted.
      - name: status
        in: query
        schema:
          enum:
          - pending
          - posted
          - archived
          type: string
        required: false
        description: Get all ledger entries that match the status specified. One of
          `pending`, `posted`, or `archived`. For multiple statuses, use `status[]=pending&status[]=posted`.
      - name: status[]
        in: query
        schema:
          items:
            enum:
            - pending
            - posted
            - archived
            type: string
          type: array
        required: false
        description: Get all ledger entries that match the status specified. One of
          `pending`, `posted`, or `archived`. For multiple statuses, use `status[]=pending&status[]=posted`.
      - name: updated_at
        in: query
        schema:
          additionalProperties:
            format: date-time
            type: string
          type: object
        style: deepObject
        required: false
        description: Use `gt` (>), `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to
          filter by the posted at timestamp. For example, for all times after Jan
          1 2000 12:00 UTC, use updated_at%5Bgt%5D=2000-01-01T12:00:00Z.
      - "$ref": "#/components/parameters/bulk_id"
      - "$ref": "#/components/parameters/metadata_query"
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
