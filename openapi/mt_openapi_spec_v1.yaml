  "/api/payment_actions":
    get:
      summary: list payment_actions
      tags:
      - PaymentAction
      operationId: listPaymentActions
      description: Get a list of all payment actions.
      security:
      - basic_auth: []
      parameters:
      - name: actionable_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: The ID of the associated actionable object.
      - name: actionable_type
        in: query
        schema:
          type: string
        required: false
        description: The type of the associated actionable object. One of `payment_order`,
          `expected_payment`.
      - name: after_cursor
        in: query
        schema:
          nullable: true
          type: string
        required: false
      - name: created_at
        in: query
        schema:
          properties:
            eq:
              format: date-time
              type: string
            gt:
              format: date-time
              type: string
            gte:
              format: date-time
              type: string
            lt:
              format: date-time
              type: string
            lte:
              format: date-time
              type: string
          type: object
        style: deepObject
        explode: true
        required: false
        description: Filter by `created_at` using comparison operators like `gt` (>),
          `gte` (>=), `lt` (<), `lte` (<=), or `eq` (=) to filter by the created at
          timestamp. For example, `created_at[gte]=2024-01-01T00:00:00Z`
      - name: internal_account_id
        in: query
        schema:
          format: uuid
          type: string
        required: false
        description: The ID of one of your internal accounts.
      - name: per_page
        in: query
        schema:
          type: integer
        required: false
      - name: status
        in: query
        schema:
          enum:
          - pending
          - processable
          - processing
          - sent
          - acknowledged
          - failed
          - cancelled
          type: string
        required: false
        description: Filter by payment actions of a specific status.
      - name: type
        in: query
        schema:
          enum:
          - stop
          - issue
          type: string
        required: false
        description: The type of payment action.
      - "$ref": "#/components/parameters/metadata_query"
      responses:
        '200':
          description: successful
          headers:
            X-After-Cursor:
              schema:
                nullable: true
                type: string
              required: false
              description: The cursor for the next page. Including this in a call
                as `after_cursor` will return the next page.
            X-Per-Page:
              schema:
                nullable: true
                type: integer
              description: The current `per_page`.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/payment_action"
    post:
      summary: create payment_action
      tags:
      - PaymentAction
      operationId: createPaymentAction
      description: Create a payment action.
      security:
      - basic_auth: []
      parameters:
      - name: Idempotency-Key
        in: header
        schema:
          type: string
        required: false
        description: This key should be something unique, preferably something like
          an UUID.
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/payment_action_create_request"
      responses:
        '201':
          description: successful
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/payment_action"
        '422':
          description: invalid type
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error_message"
